name: Pages

on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - id: pages
        uses: actions/configure-pages@v6

      # Links in site/ say __REPO__ for owner/name, and __SITE__ for the site's own address
      # (link previews want absolute URLs), so the page works from any fork
      - name: Prepare site
        env:
          SITE: ${{ steps.pages.outputs.base_url }}
        run: |
          cp -R site _site
          sed -i -e "s|__REPO__|${GITHUB_REPOSITORY}|g" -e "s|__SITE__|${SITE%/}|g" _site/*.html

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v5
