name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64
            runner: ubuntu-24.04
            jit: true
            gpu: true
          - target: linux-aarch64
            runner: ubuntu-24.04-arm
            jit: true
            gpu: true
          - target: macos-x86_64
            runner: macos-26-intel
            jit: true
          - target: macos-aarch64
            runner: macos-26
            jit: true
    env:
      CFLAGS: -O3 -g -Werror
      CXXFLAGS: -O3 -g -Werror
      # Without this, macOS binaries only run on the runner's macOS version or later
      MACOSX_DEPLOYMENT_TARGET: '11.0'
    steps:
      - uses: actions/checkout@v7

      # (the x86-64 JIT needs x86-64-v3: AVX2, FMA, BMI1/2, LZCNT, MOVBE)
      - name: Toolchain
        run: |
          uname -m
          cc --version
          if [ "$(uname -s)" = Darwin ]; then sysctl -n machdep.cpu.brand_string machdep.cpu.features machdep.cpu.leaf7_features 2>/dev/null || true
          else grep -m2 -E '^(model name|flags)' /proc/cpuinfo || true; fi

      # Mesa's EGL and software OpenGL (llvmpipe), for the GPU backend's tests
      - name: OpenGL
        if: matrix.gpu
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libegl-mesa0 libgl1-mesa-dri

      - name: Build
        run: make -j"$(getconf _NPROCESSORS_ONLN)" all build/blue-tests

      # With BLUE_TEST_GPU, the GPU tests fail rather than skip if there's no OpenGL context
      - name: Test
        run: |
          if [ '${{ matrix.gpu }}' = true ]; then export BLUE_TEST_GPU=1; fi
          make test

      # BLUE_TEST_JIT=1: no JIT here is a failure, not a skip
      - name: JIT fuzzing
        if: matrix.jit
        run: BLUE_TEST_JIT=1 BLUE_JIT_PROGRAMS=100000 build/blue-tests jit

      # Guest instructions a second, interpreted and translated (for the log; not a test)
      - name: JIT speed
        if: matrix.jit
        continue-on-error: true
        run: BLUE_JIT_BENCH=1 build/blue-tests jit

      # A tarball keeps the executable bit, which artifact zips drop. On Linux it has the
      # desktop entry and icons too, laid out as under ~/.local/share
      - name: Package
        run: |
          dir=blue-${{ matrix.target }}
          mkdir "$dir"
          cp build/blue README.md "$dir/"
          if [ "$(uname -s)" = Linux ]; then
            mkdir -p "$dir/share/applications"
            cp art/blue.desktop "$dir/share/applications/"
            for n in 16 24 32 48 64 128 256 512; do
              mkdir -p "$dir/share/icons/hicolor/${n}x${n}/apps"
              cp "art/png/blue-$n.png" "$dir/share/icons/hicolor/${n}x${n}/apps/blue.png"
            done
          fi
          tar -czf "$dir.tar.gz" "$dir"

      - uses: actions/upload-artifact@v7
        with:
          path: blue-${{ matrix.target }}.tar.gz
          archive: false
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: blue-*
          path: dist
          merge-multiple: true

      - name: Publish release
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          sha256sum blue-*.tar.gz > SHA256SUMS
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" blue-*.tar.gz SHA256SUMS --clobber
          else
            gh release create "$TAG" blue-*.tar.gz SHA256SUMS --title "$TAG" --generate-notes --verify-tag
          fi
