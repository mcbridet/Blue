name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64
            runner: ubuntu-24.04
            jit: true
            gpu: true
          - target: linux-aarch64
            runner: ubuntu-24.04-arm
            jit: true
            gpu: true
          - target: macos-x86_64
            runner: macos-26-intel
            jit: true
          - target: macos-aarch64
            runner: macos-26
            jit: true
    env:
      CFLAGS: -O3 -g -Werror
      CXXFLAGS: -O3 -g -Werror
      # The oldest macOS Blue.app runs on, on either architecture (its libraries are built for it too)
      MACOSX_DEPLOYMENT_TARGET: '11.0'
    steps:
      - uses: actions/checkout@v7

      # (the x86-64 JIT needs x86-64-v3: AVX2, FMA, BMI1/2, LZCNT, MOVBE)
      - name: Toolchain
        run: |
          uname -m
          cc --version
          if [ "$(uname -s)" = Darwin ]; then sysctl -n machdep.cpu.brand_string machdep.cpu.features machdep.cpu.leaf7_features 2>/dev/null || true
          else grep -m2 -E '^(model name|flags)' /proc/cpuinfo || true; fi

      # Mesa's EGL and software OpenGL (llvmpipe), for the GPU backend's tests
      - name: OpenGL
        if: matrix.gpu
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libegl-mesa0 libgl1-mesa-dri

      - name: Build
        run: make -j"$(getconf _NPROCESSORS_ONLN)" all build/blue-tests

      # With BLUE_TEST_GPU, the GPU tests fail rather than skip if there's no OpenGL context
      - name: Test
        run: |
          if [ '${{ matrix.gpu }}' = true ]; then export BLUE_TEST_GPU=1; fi
          make test

      # BLUE_TEST_JIT=1: no JIT here is a failure, not a skip
      - name: JIT fuzzing
        if: matrix.jit
        run: BLUE_TEST_JIT=1 BLUE_JIT_PROGRAMS=100000 build/blue-tests jit

      # Guest instructions a second, interpreted and translated (for the log; not a test)
      - name: JIT speed
        if: matrix.jit
        continue-on-error: true
        run: BLUE_JIT_BENCH=1 build/blue-tests jit

      # Blue.app's libraries, built from their sources for MACOSX_DEPLOYMENT_TARGET (Homebrew's
      # need the macOS they were built on), kept between runs until tools/macos-deps.sh changes,
      # with those sources (share/sources)
      - name: Cache Blue.app's libraries
        if: runner.os == 'macOS'
        id: deps
        uses: actions/cache@v6
        with:
          path: ~/blue-deps
          key: blue-deps-${{ matrix.target }}-${{ env.MACOSX_DEPLOYMENT_TARGET }}-${{ hashFiles('tools/macos-deps.sh') }}

      - name: Build Blue.app's libraries
        if: runner.os == 'macOS' && steps.deps.outputs.cache-hit != 'true'
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet meson ninja
          export PATH="$RUNNER_TEMP/venv/bin:$PATH"
          command -v pkg-config || brew install pkgconf
          tools/macos-deps.sh ~/blue-deps

      # Blue.app for this architecture, in Blue-arm64.dmg or Blue-x86_64.dmg: its own libraries, not the
      # system's (--version says where they came from), none needing a newer macOS (Homebrew's, say)
      - name: Blue.app and its disk image
        if: runner.os == 'macOS'
        run: |
          make dmg DEPS="$HOME/blue-deps"
          plutil -p build/Blue.app/Contents/Info.plist
          test "$(plutil -extract LSMinimumSystemVersion raw build/Blue.app/Contents/Info.plist)" = "$MACOSX_DEPLOYMENT_TARGET"
          dmg=$(ls build/Blue-*.dmg)
          hdiutil attach -nobrowse -readonly -mountpoint "$RUNNER_TEMP/dmg" "$dmg"
          ls -la "$RUNNER_TEMP/dmg"
          codesign --verify --deep --strict "$RUNNER_TEMP/dmg/Blue.app"
          "$RUNNER_TEMP/dmg/Blue.app/Contents/MacOS/blue" --version | tee version.txt
          # Spotlight and the like can keep the volume busy for a moment
          detached=
          for i in 1 2 3 4 5; do hdiutil detach "$RUNNER_TEMP/dmg" && { detached=1; break; }; sleep 3; done
          test -n "$detached" || hdiutil detach -force "$RUNNER_TEMP/dmg"
          grep -q 'SDL2 .*/Blue.app/Contents/Frameworks/libSDL2-2.0.0.dylib$' version.txt
          grep -q 'libslirp .*/Blue.app/Contents/Frameworks/libslirp.0.dylib$' version.txt

      - name: Upload the disk image
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          path: build/Blue-*.dmg
          archive: false
          if-no-files-found: error

      # The exact sources of the libraries in it, as tools/macos-deps.sh keeps them (in ~/blue-deps,
      # so cached with them), checked by SHA-256
      - name: The disk image's sources
        if: runner.os == 'macOS'
        run: |
          dmg=$(ls build/Blue-*.dmg)
          tools/package-macos.sh sources build/Blue.app "$HOME/blue-deps" "$(basename "$dmg")" dist/sources
          cat dist/sources/SOURCES

      # The AppImage, built in Ubuntu 22.04 (glibc 2.35) so that it runs on most distributions since;
      # then run here (Ubuntu 24.04), its own libraries loaded. With the exact sources of the libraries
      # in it: SDL2's tarball, and Ubuntu's source packages of the versions bundled (apt-get source)
      - name: AppImage
        if: runner.os == 'Linux'
        run: |
          docker run --rm -v "$PWD:/src" -e BUILD=/tmp/appimage -e OUT=/src/dist -e SOURCES=/src/dist/sources \
            ubuntu:22.04 /src/tools/package-linux.sh --setup
          image=$(ls dist/Blue-*.AppImage)
          "$image" --appimage-extract-and-run --version | tee version.txt
          grep -q 'SDL2 .*/usr/lib/libSDL2-2.0.so.0$' version.txt
          grep -q 'libslirp .*/usr/lib/libslirp.so.0$' version.txt
          cat dist/sources/SOURCES

      - name: Upload the AppImage
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          path: dist/Blue-*.AppImage
          archive: false
          if-no-files-found: error

      - name: Upload the sources
        uses: actions/upload-artifact@v7
        with:
          name: sources-${{ matrix.target }}
          path: dist/sources
          if-no-files-found: error

  # Blue-third-party-sources.tar.gz: the packages' sources, each file once, with a README (every run, so
  # that a release's is no surprise)
  sources:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: sources-*
          path: sources

      - name: Blue-third-party-sources.tar.gz
        run: |
          tools/third-party-sources.sh dist/Blue-third-party-sources.tar.gz sources/*
          tar -tvzf dist/Blue-third-party-sources.tar.gz
          tar -xzOf dist/Blue-third-party-sources.tar.gz Blue-third-party-sources/README.txt

      - name: Upload it
        uses: actions/upload-artifact@v7
        with:
          path: dist/Blue-third-party-sources.tar.gz
          archive: false
          if-no-files-found: error

  # A release's tag is the version in src/version.h, with a v
  version:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Tag and version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(sed -n 's/^#define BLUE_VERSION "\(.*\)"/\1/p' src/version.h)
          if [ "$TAG" != "v$version" ]; then
            echo "::error::the tag $TAG isn't src/version.h's version, $version (tag v$version, or change it)"
            exit 1
          fi

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, version, sources]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      # (the disk images, the AppImages and Blue-third-party-sources.tar.gz)
      - uses: actions/download-artifact@v8
        with:
          pattern: Blue*
          path: dist
          merge-multiple: true

      # (unversioned names, so that releases/latest/download/<name> links keep working)
      - name: Publish release
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -la
          set -- Blue-arm64.dmg Blue-x86_64.dmg Blue-x86_64.AppImage Blue-aarch64.AppImage \
            Blue-third-party-sources.tar.gz
          sha256sum "$@" > SHA256SUMS
          cat SHA256SUMS
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "$@" SHA256SUMS --clobber
          else
            gh release create "$TAG" "$@" SHA256SUMS --title "$TAG" --generate-notes --verify-tag
          fi
