name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64
            runner: ubuntu-24.04
            gpu: true
          - target: linux-aarch64
            runner: ubuntu-24.04-arm
            jit: true
            gpu: true
          - target: macos-x86_64
            runner: macos-26-intel
          - target: macos-aarch64
            runner: macos-26
            jit: true
    env:
      CFLAGS: -O3 -g -Werror
      CXXFLAGS: -O3 -g -Werror
      # Without this, macOS binaries only run on the runner's macOS version or later
      MACOSX_DEPLOYMENT_TARGET: '11.0'
    steps:
      - uses: actions/checkout@v7

      - name: Toolchain
        run: |
          uname -m
          cc --version

      # Mesa's EGL and software OpenGL (llvmpipe), for the GPU backend's tests
      - name: OpenGL
        if: matrix.gpu
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libegl-mesa0 libgl1-mesa-dri

      - name: Build
        run: make -j"$(getconf _NPROCESSORS_ONLN)" all build/syshm-tests

      # With SYSHM_TEST_GPU, the GPU tests fail rather than skip if there's no OpenGL context
      - name: Test
        run: |
          if [ '${{ matrix.gpu }}' = true ]; then export SYSHM_TEST_GPU=1; fi
          make test

      - name: JIT fuzzing
        if: matrix.jit
        run: SYSHM_JIT_PROGRAMS=100000 build/syshm-tests jit

      # A tarball keeps the executable bit, which artifact zips drop
      - name: Package
        run: |
          dir=syshm-${{ matrix.target }}
          mkdir "$dir"
          cp build/syshm README.md "$dir/"
          tar -czf "$dir.tar.gz" "$dir"

      - uses: actions/upload-artifact@v7
        with:
          path: syshm-${{ matrix.target }}.tar.gz
          archive: false
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: syshm-*
          path: dist
          merge-multiple: true

      - name: Publish release
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          sha256sum syshm-*.tar.gz > SHA256SUMS
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" syshm-*.tar.gz SHA256SUMS --clobber
          else
            gh release create "$TAG" syshm-*.tar.gz SHA256SUMS --title "$TAG" --generate-notes --verify-tag
          fi
